[workspace]
members = [
    "crates/openmontage-core",
    "crates/openmontage-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenMontage Contributors", "Brandon Hubbard <bhubbard@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/bhubbard/openmontage-rs"
homepage = "https://github.com/bhubbard/openmontage-rs"
documentation = "https://github.com/bhubbard/openmontage-rs#readme"
readme = "README.md"
keywords = ["openmontage", "video-production", "timeline", "agentic-video", "montage"]
categories = ["multimedia::video", "command-line-utilities"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
hound = "3.5"
tempfile = "3.12"
indicatif = "0.17"
